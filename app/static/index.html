<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A local streaming chat interface." />
    <title>Chat</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #111210;
        --surface: #1c1d1a;
        --border: #2c2d29;
        --text: #f1f1ed;
        --muted: #8e8f88;
        --error: #ff837a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, textarea { font: inherit; }
      button { color: inherit; }
      .app { display: grid; grid-template-rows: 48px auto minmax(0, 1fr) auto; height: 100%; }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 0 20px;
      }
      .clear {
        padding: 6px 0;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }
      .clear:hover { color: var(--text); }
      .clear[hidden] { display: block; visibility: hidden; }
      .runtime-status { display: flex; align-items: center; gap: 9px; }
      .mode-switch {
        display: flex;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
      }
      .mode-option {
        padding: 4px 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
      }
      .mode-option.active { background: var(--background); color: var(--text); }
      .mode-option:disabled { cursor: default; opacity: 0.55; }
      .terminal-mode {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .terminal-mode.host { color: #e2a65c; }
      .terminal-mode.unready { color: var(--error); }
      .memory-mode {
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .memory-mode:hover { color: var(--text); }
      .agent-panel {
        width: min(1120px, calc(100% - 40px));
        max-height: min(66vh, 760px);
        margin: 8px auto 0;
        padding: 13px 15px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
      }
      .agent-panel[hidden] { display: none; }
      .agent-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
      .agent-title { min-width: 0; }
      .agent-status { color: #9db8ff; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
      .agent-goal { margin-top: 3px; overflow: hidden; color: var(--text); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .agent-actions { display: flex; flex: 0 0 auto; gap: 7px; }
      .agent-action {
        padding: 5px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--background);
        cursor: pointer;
        font-size: 11px;
      }
      .agent-action:disabled { cursor: default; opacity: 0.45; }
      .agent-plan { display: grid; gap: 4px; margin: 11px 0 0; padding: 0; list-style: none; }
      .agent-step { display: flex; gap: 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
      .agent-step::before { content: "○"; flex: 0 0 auto; }
      .agent-step.in_progress { color: var(--text); }
      .agent-step.in_progress::before { content: "◉"; color: #9db8ff; }
      .agent-step.completed::before { content: "✓"; color: #6fbb88; }
      .agent-evidence { margin-top: 9px; }
      .agent-evidence-label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
      .agent-evidence-list { margin: 5px 0 0; padding-left: 18px; color: var(--muted); font-size: 11px; }
      .agent-workers { margin-top: 9px; }
      .graph-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .graph-toolbar-actions { display: flex; gap: 5px; }
      .graph-view-button {
        padding: 3px 7px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--background);
        color: var(--muted);
        cursor: pointer;
        font-size: 9px;
      }
      .graph-view-button.active { color: var(--text); border-color: #55564f; }
      .graph-canvas {
        margin-top: 7px;
        padding: 10px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--background);
      }
      .graph-stage { position: relative; display: flex; gap: 34px; min-height: 110px; }
      .graph-edges { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
      .graph-edge { fill: none; stroke: #454740; stroke-width: 1.5; }
      .graph-column { position: relative; z-index: 1; display: grid; align-content: start; gap: 9px; width: 180px; flex: 0 0 180px; }
      .graph-node {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-left: 3px solid #718fd8;
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }
      .graph-node.completed, .graph-node.integrated, .graph-node.no_changes { border-left-color: #6fbb88; }
      .graph-node.failed, .graph-node.blocked, .graph-node.conflict,
      .graph-node.discarded, .graph-node.rolled_back { border-left-color: var(--error); }
      .graph-node.paused, .graph-node.skipped, .graph-node.waiting_for_integration { border-left-color: #e2a65c; }
      .graph-node-key { display: block; color: var(--muted); font: 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .graph-node-title { display: block; margin-top: 3px; font-size: 11px; line-height: 1.3; }
      .graph-node-meta { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
      .graph-timeline { display: grid; gap: 0; margin-top: 7px; padding: 4px 0; }
      .timeline-item { position: relative; display: grid; grid-template-columns: 80px 1fr; gap: 12px; padding: 7px 0 7px 17px; margin-left: 5px; border-left: 1px solid var(--border); font-size: 10px; }
      .timeline-item::before { content: ""; position: absolute; left: -4px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: #718fd8; }
      .timeline-time { color: var(--muted); }
      .timeline-event { overflow-wrap: anywhere; }
      .artifact-chip { display: inline-flex; margin: 3px 4px 0 0; padding: 3px 6px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); color: #9db8ff; cursor: pointer; font-size: 9px; }
      .agent-worker-list { display: grid; gap: 5px; margin: 5px 0 0; padding: 0; list-style: none; }
      .agent-worker { display: flex; align-items: baseline; gap: 7px; color: var(--muted); font-size: 11px; }
      .node-action { margin-left: auto; padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--background); color: var(--muted); cursor: pointer; font-size: 9px; }
      .node-action:hover { color: var(--text); }
      .agent-worker-status { flex: 0 0 auto; color: #9db8ff; font-size: 9px; text-transform: uppercase; }
      .agent-worker.completed .agent-worker-status { color: #6fbb88; }
      .agent-worker.integrated .agent-worker-status { color: #6fbb88; }
      .agent-worker.pending .agent-worker-status { color: #e2a65c; }
      .agent-worker.conflict .agent-worker-status { color: var(--error); }
      .agent-worker.failed .agent-worker-status,
      .agent-worker.stopped .agent-worker-status { color: var(--error); }
      .agent-worker.waiting_for_integration .agent-worker-status { color: #e2a65c; }
      .agent-worker.paused .agent-worker-status,
      .agent-worker.skipped .agent-worker-status { color: #e2a65c; }
      .agent-worker.blocked .agent-worker-status,
      .agent-worker.discarded .agent-worker-status,
      .agent-worker.rolled_back .agent-worker-status { color: var(--error); }
      .agent-meta { margin-top: 9px; color: var(--muted); font-size: 10px; }
      .agent-log { display: grid; gap: 5px; margin: 10px 0 0; padding: 9px 0 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
      .agent-log[hidden] { display: none; }
      .agent-log-item { display: flex; justify-content: space-between; gap: 12px; }
      .agent-log-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .operator-dialog {
        width: min(780px, calc(100% - 28px));
        max-height: min(84vh, 820px);
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
      }
      .operator-dialog::backdrop { background: rgba(0, 0, 0, 0.66); }
      .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
      .dialog-title { font-size: 13px; }
      .dialog-close { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
      .dialog-content { max-height: calc(84vh - 52px); padding: 14px; overflow: auto; }
      .operator-grid { display: grid; gap: 10px; }
      .operator-field { display: grid; gap: 4px; color: var(--muted); font-size: 10px; }
      .operator-field input, .operator-field textarea, .operator-field select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        outline: 0;
        background: var(--background);
        color: var(--text);
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .operator-field textarea { min-height: 180px; resize: vertical; }
      .operator-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
      .operator-row input, .operator-row select {
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--background);
        color: var(--text);
        font-size: 10px;
      }
      .operator-card { padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--background); }
      .operator-card + .operator-card { margin-top: 8px; }
      .operator-card-title { font-size: 11px; }
      .operator-card-meta { margin-top: 4px; color: var(--muted); font-size: 9px; }
      .operator-pre { max-height: 480px; margin: 8px 0 0; padding: 11px; overflow: auto; border-radius: 8px; background: var(--background); white-space: pre-wrap; overflow-wrap: anywhere; font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .comparison-table { width: 100%; border-collapse: collapse; font-size: 10px; }
      .comparison-table th, .comparison-table td { padding: 7px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
      .agent-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 15px;
        width: min(720px, 100%);
        margin: 0 auto 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .agent-options[hidden] { display: none; }
      .agent-options label { display: flex; align-items: center; gap: 6px; }
      .status {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #666761;
      }
      .status.online { background: #4e9f6d; }
      .status.offline { background: #d45b52; }
      .messages {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 32px 20px 40px;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        padding-bottom: 10vh;
        color: var(--muted);
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .message { display: flex; margin-bottom: 28px; }
      .message.user { justify-content: flex-end; }
      .message-content {
        max-width: 88%;
        overflow-wrap: anywhere;
        font-size: 15px;
        line-height: 1.65;
      }
      .user .message-content {
        padding: 10px 15px;
        border-radius: 18px;
        background: var(--surface);
        white-space: pre-wrap;
      }
      .assistant .message-content { width: 100%; }
      .assistant .message-content > :first-child { margin-top: 0; }
      .assistant .message-content > :last-child { margin-bottom: 0; }
      .assistant .message-content p { margin: 0 0 1em; }
      .assistant .message-content h1,
      .assistant .message-content h2,
      .assistant .message-content h3,
      .assistant .message-content h4,
      .assistant .message-content h5,
      .assistant .message-content h6 {
        margin: 1.35em 0 0.55em;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .assistant .message-content h1 { font-size: 1.6em; }
      .assistant .message-content h2 { font-size: 1.35em; }
      .assistant .message-content h3 { font-size: 1.15em; }
      .assistant .message-content ul,
      .assistant .message-content ol { margin: 0 0 1em; padding-left: 1.55em; }
      .assistant .message-content li { margin: 0.25em 0; padding-left: 0.15em; }
      .assistant .message-content .task-item { list-style: none; margin-left: -1.35em; }
      .assistant .message-content input[type="checkbox"] { vertical-align: -1px; }
      .assistant .message-content blockquote {
        margin: 0 0 1em;
        padding-left: 1em;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      .assistant .message-content code {
        padding: 0.16em 0.38em;
        border-radius: 5px;
        background: var(--surface);
        font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .assistant .message-content pre {
        margin: 0 0 1em;
        padding: 14px 16px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .assistant .message-content pre code {
        padding: 0;
        border-radius: 0;
        background: transparent;
        white-space: pre;
        font-size: 12px;
      }
      .assistant .message-content a { color: #9db8ff; text-underline-offset: 3px; }
      .assistant .message-content hr { margin: 1.25em 0; border: 0; border-top: 1px solid var(--border); }
      .assistant .message-content .table-wrap { margin: 0 0 1em; overflow-x: auto; }
      .assistant .message-content table { width: 100%; border-collapse: collapse; font-size: 0.93em; }
      .assistant .message-content th,
      .assistant .message-content td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; }
      .assistant .message-content th { background: var(--surface); font-weight: 600; }
      .assistant { flex-direction: column; align-items: stretch; }
      .tool-event {
        margin-top: 12px;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        line-height: 1.45;
      }
      .tool-event.failed { color: var(--error); }
      .tool-preview {
        max-height: 120px;
        margin: 9px 0 0;
        padding: 9px;
        overflow: auto;
        border-radius: 8px;
        background: var(--background);
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .change-review { display: grid; gap: 9px; margin-top: 10px; }
      .review-file { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
      .review-file summary { padding: 9px 10px; cursor: pointer; font-size: 11px; }
      .review-file.conflict summary { color: var(--error); }
      .review-options { display: grid; gap: 6px; padding: 0 10px 9px; font-size: 11px; }
      .review-hunks { display: grid; gap: 4px; padding-left: 18px; color: var(--muted); }
      .review-diff { max-height: 420px; margin: 0; border: 0; border-radius: 0; }
      .tool-actions { display: flex; gap: 7px; margin-top: 10px; }
      .tool-action {
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
      }
      .tool-action.primary { background: var(--text); color: var(--background); }
      .tool-action:disabled { opacity: 0.45; cursor: default; }
      .cursor::after {
        content: "";
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 3px;
        vertical-align: -2px;
        background: currentColor;
        animation: blink 0.85s infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .error {
        margin: -12px 0 28px;
        color: var(--error);
        font-size: 13px;
        line-height: 1.5;
      }
      .composer-area {
        padding: 8px 20px max(20px, env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, rgba(17, 18, 16, 0), var(--background) 24px);
      }
      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 36px;
        align-items: end;
        gap: 10px;
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 10px 10px 10px 16px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--background);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      }
      .composer:focus-within { border-color: #55564f; }
      textarea {
        width: 100%;
        min-height: 26px;
        max-height: 180px;
        padding: 3px 0;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        line-height: 1.45;
      }
      textarea::placeholder { color: var(--muted); }
      .send {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: var(--text);
        color: var(--background);
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
      }
      .send:disabled { opacity: 0.16; cursor: default; }
      .send .stop { display: none; width: 10px; height: 10px; border-radius: 1px; background: currentColor; }
      .send.streaming .arrow { display: none; }
      .send.streaming .stop { display: block; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 600px) {
        .toolbar { padding-inline: 16px; }
        .messages { padding: 24px 16px 28px; }
        .composer-area { padding-inline: 12px; }
        .message-content { max-width: 92%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <button id="clearButton" class="clear" type="button" hidden>Clear</button>
        <div class="mode-switch" role="group" aria-label="Interaction mode">
          <button id="chatMode" class="mode-option active" type="button">Chat</button>
          <button id="agentMode" class="mode-option" type="button">Agent</button>
        </div>
        <div class="runtime-status">
          <button id="memoryStatus" class="memory-mode" type="button" title="Open hybrid memory browser">Memory</button>
          <span id="terminalMode" class="terminal-mode">Sandbox</span>
          <span id="status" class="status" role="status" title="Checking connection">
            <span id="statusText" class="sr-only">Checking connection</span>
          </span>
        </div>
      </div>
      <section id="agentPanel" class="agent-panel" aria-live="polite" hidden>
        <div class="agent-head">
          <div class="agent-title">
            <div id="agentStatus" class="agent-status">Planning</div>
            <div id="agentGoal" class="agent-goal"></div>
          </div>
          <div class="agent-actions">
            <button id="templatesAgent" class="agent-action" type="button">Templates</button>
            <button id="historyAgent" class="agent-action" type="button">History</button>
            <button id="activityAgent" class="agent-action" type="button">Activity</button>
            <button id="observeAgent" class="agent-action" type="button">Observe</button>
            <button id="evalsAgent" class="agent-action" type="button">Evals</button>
            <button id="compareAgent" class="agent-action" type="button">Compare</button>
            <button id="cloneAgent" class="agent-action" type="button">Clone</button>
            <button id="debugAgent" class="agent-action" type="button">Debug</button>
            <button id="steerAgent" class="agent-action" type="button" hidden>Steer</button>
            <button id="newAgent" class="agent-action" type="button" hidden>New</button>
            <button id="resumeAgent" class="agent-action" type="button" hidden>Resume</button>
            <button id="stopAgent" class="agent-action" type="button" hidden>Stop</button>
          </div>
        </div>
        <ol id="agentPlan" class="agent-plan"></ol>
        <div id="agentGraph" class="agent-workers" hidden>
          <div class="graph-toolbar">
            <div id="agentGraphLabel" class="agent-evidence-label">Orchestration</div>
            <div class="graph-toolbar-actions">
              <button id="graphDagView" class="graph-view-button active" type="button">DAG</button>
              <button id="graphTimelineView" class="graph-view-button" type="button">Timeline</button>
            </div>
          </div>
          <div id="agentGraphCanvas" class="graph-canvas"></div>
          <div id="agentGraphTimeline" class="graph-timeline" hidden></div>
        </div>
        <div id="agentWorkers" class="agent-workers" hidden>
          <div class="agent-evidence-label">Workers</div>
          <ul id="agentWorkerList" class="agent-worker-list"></ul>
        </div>
        <div id="agentEvidence" class="agent-evidence" hidden>
          <div class="agent-evidence-label">Verification</div>
          <ul id="agentEvidenceList" class="agent-evidence-list"></ul>
        </div>
        <div id="agentMeta" class="agent-meta"></div>
        <div id="agentLog" class="agent-log" hidden></div>
      </section>
      <main id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty">Ask anything</div>
      </main>
      <div class="composer-area">
        <div id="agentOptions" class="agent-options" hidden>
          <span>Optional run grants:</span>
          <label><input id="grantWorkspace" type="checkbox" /> workspace changes</label>
          <label><input id="grantTerminal" type="checkbox" /> terminal commands</label>
        </div>
        <form id="chatForm" class="composer">

        const workerTasks = run.worker_tasks || [];

          const text = document.createElement("span");

          text.textContent = `${task.role}: ${task.title}${changeCount ? ` · ${changeCount} changes` : ""}${reviewed}`;
          const changeSummary = (task.change_set || [])

          text.title = [
            `Mode: ${task.mode}`,
            `Scope: ${task.scope}`,

            task.review_decision

          item.append(status, text);
          agentWorkerListEl.append(item);

        const evidence = run.verification_evidence || [];

        for (const evidenceItem of evidence) {

          if (typeof evidenceItem === "object" && evidenceItem?.tool) {

          agentEvidenceListEl.append(item);

        const usage = run.usage || {};
        const budget = run.budgets || {};
        agentMetaEl.textContent = [

          `${usage.tool_rounds || 0}/${budget.max_tool_rounds || 0} rounds`,
          `${usage.tool_calls || 0}/${budget.max_tool_calls || 0} tools`,
          `${usage.elapsed_seconds || 0}/${budget.max_seconds || 0}s`,
          `${usage.total_tokens || 0} tokens${usage.provider_token_calls ? " measured" : " estimated"}`,

      }
      function showOperatorDialog(title, content) {
        operatorDialogTitleEl.textContent = title;
        operatorDialogContentEl.replaceChildren(content);
        if (!operatorDialog.open) operatorDialog.showModal();
      }
      function graphNodeDepth(nodes, key, memo = new Map(), visiting = new Set()) {
        if (memo.has(key)) return memo.get(key);
        if (visiting.has(key)) return 0;
        visiting.add(key);
        const node = nodes[key];
        const depth = !node || !(node.depends_on || []).length
          ? 0
          : 1 + Math.max(...node.depends_on.map((dependency) => graphNodeDepth(nodes, dependency, memo, visiting)));
        visiting.delete(key);
        memo.set(key, depth);
        return depth;
      }
      function renderGraph(run) {
        const graph = run.task_graph;
        if (!graph) return;
        const nodes = graph.nodes || {};
        graphDagViewButton.classList.toggle("active", graphView === "dag");
        graphTimelineViewButton.classList.toggle("active", graphView === "timeline");
        agentGraphCanvasEl.hidden = graphView !== "dag";
        agentGraphTimelineEl.hidden = graphView !== "timeline";
        if (graphView === "timeline") {
          loadGraphTimeline();
          return;
        }
        const memo = new Map();
        const columns = new Map();
        for (const node of Object.values(nodes)) {
          const depth = graphNodeDepth(nodes, node.key, memo);
          if (!columns.has(depth)) columns.set(depth, []);
          columns.get(depth).push(node);
        }
        const stage = document.createElement("div");
        stage.className = "graph-stage";
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.classList.add("graph-edges");
        stage.append(svg);
        for (const depth of [...columns.keys()].sort((left, right) => left - right)) {
          const column = document.createElement("div");
          column.className = "graph-column";
          for (const node of columns.get(depth).sort((left, right) => left.created_at.localeCompare(right.created_at))) {
            const card = document.createElement("button");
            card.type = "button";
            card.className = `graph-node ${node.status}`;
            card.dataset.nodeKey = node.key;
            const key = document.createElement("span");
            key.className = "graph-node-key";
            key.textContent = `${node.key} · ${node.status.replaceAll("_", " ")}`;
            const title = document.createElement("span");
            title.className = "graph-node-title";
            title.textContent = node.title;
            const meta = document.createElement("span");
            meta.className = "graph-node-meta";
            meta.textContent = [
              node.kind || "task",
              node.role,
              (node.artifacts || []).length ? `${node.artifacts.length} artifact(s)` : "",
            ].filter(Boolean).join(" · ");
            card.append(key, title, meta);
            card.addEventListener("click", () => openGraphNode(node.key));
            column.append(card);
          }
          stage.append(column);
        }
        agentGraphCanvasEl.replaceChildren(stage);
        requestAnimationFrame(() => drawGraphEdges(stage, svg, nodes));
      }
      function drawGraphEdges(stage, svg, nodes) {
        const stageBox = stage.getBoundingClientRect();
        svg.setAttribute("width", String(stage.scrollWidth));
        svg.setAttribute("height", String(stage.scrollHeight));
        svg.replaceChildren();
        const cards = new Map(
          [...stage.querySelectorAll(".graph-node")].map((card) => [card.dataset.nodeKey, card]),
        );
        for (const node of Object.values(nodes)) {
          const target = cards.get(node.key);
          if (!target) continue;
          const targetBox = target.getBoundingClientRect();
          for (const dependency of node.depends_on || []) {
            const source = cards.get(dependency);
            if (!source) continue;
            const sourceBox = source.getBoundingClientRect();
            const startX = sourceBox.right - stageBox.left;
            const startY = sourceBox.top + sourceBox.height / 2 - stageBox.top;
            const endX = targetBox.left - stageBox.left;
            const endY = targetBox.top + targetBox.height / 2 - stageBox.top;
            const bend = Math.max(18, (endX - startX) / 2);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.classList.add("graph-edge");
            path.setAttribute("d", `M ${startX} ${startY} C ${startX + bend} ${startY}, ${endX - bend} ${endY}, ${endX} ${endY}`);
            svg.append(path);
          }
        }
      }
      function graphNodeSpecification(node) {
        const specification = {
          key: node.key,
          title: node.title,
          instruction: node.instruction,
          role: node.role,
          scope: node.scope,
          mode: node.mode,
          depends_on: node.depends_on || [],
          kind: node.kind || "task",
        };
        if (node.model) specification.model = node.model;
        if (node.node_budgets) specification.budgets = node.node_budgets;
        for (const field of ["condition", "join", "map", "loop"]) {
          if (node[field]) specification[field] = node[field];
        }
        return specification;
      }
      function openGraphNode(key) {
        const node = activeAgentRun?.task_graph?.nodes?.[key];
        if (!node) return;
        const content = document.createElement("div");
        content.className = "operator-grid";
        const details = document.createElement("div");
        details.className = "operator-card";
        const heading = document.createElement("div");
        heading.className = "operator-card-title";
        heading.textContent = `${node.title} · ${node.status.replaceAll("_", " ")}`;
        const meta = document.createElement("div");
        meta.className = "operator-card-meta";
        meta.textContent = [
          `${node.kind || "task"} · ${node.role} · ${node.mode}`,
          `scope ${node.scope}`,
          (node.depends_on || []).length ? `after ${node.depends_on.join(", ")}` : "root node",
          node.model ? `model ${node.model}` : "inherited model",
          node.attempt_count ? `${node.attempt_count} attempt(s)` : "",
          node.error || "",
        ].filter(Boolean).join(" · ");
        details.append(heading, meta);
        const instruction = document.createElement("pre");
        instruction.className = "operator-pre";
        instruction.textContent = node.instruction;
        details.append(instruction);
        content.append(details);
        if ((node.artifacts || []).length) {
          const artifacts = document.createElement("div");
          artifacts.className = "operator-card";
          const title = document.createElement("div");
          title.className = "operator-card-title";
          title.textContent = "Artifacts";
          artifacts.append(title);
          for (const artifact of node.artifacts) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "artifact-chip";
            chip.textContent = `${artifact.name} · ${artifact.type} · ${artifact.bytes} B`;
            chip.addEventListener("click", () => openArtifact(node.key, artifact.name));
            artifacts.append(chip);
          }
          content.append(artifacts);
        }
        const actions = document.createElement("div");
        actions.className = "operator-row";
        if (activeAgentRun.resumable) {
          let action = null;
          if (node.status === "queued") action = "pause";
          else if (node.status === "paused") action = "resume";
          else if (["completed", "integrated", "no_changes", "failed", "blocked", "cancelled", "discarded", "rolled_back", "skipped"].includes(node.status)) action = "rerun";
          if (action) {
            const control = document.createElement("button");
            control.className = "agent-action";
            control.type = "button";
            control.textContent = action;
            control.addEventListener("click", async () => {
              operatorDialog.close();
              await controlGraphNode(node.key, action);
            });
            actions.append(control);
          }
          const edit = document.createElement("button");
          edit.className = "agent-action";
          edit.type = "button";
          edit.textContent = "Edit node";
          edit.addEventListener("click", () => openNodeEditor(node));
          actions.append(edit);
        }
        content.append(actions);
        showOperatorDialog(`Graph node · ${node.key}`, content);
      }
      function openNodeEditor(node) {
        const content = document.createElement("div");
        content.className = "operator-grid";
        const field = document.createElement("label");
        field.className = "operator-field";
        field.textContent = "Node definition";
        const editor = document.createElement("textarea");
        editor.value = JSON.stringify(graphNodeSpecification(node), null, 2);
        field.append(editor);
        const reasonField = document.createElement("label");
        reasonField.className = "operator-field";
        reasonField.textContent = "Replacement reason";
        const reason = document.createElement("input");
        reason.placeholder = "Explain why this node changed";
        reasonField.append(reason);
        const cascadeLabel = document.createElement("label");
        const cascade = document.createElement("input");
        cascade.type = "checkbox";
        cascade.checked = true;
        cascadeLabel.append(cascade, document.createTextNode(" Invalidate downstream results"));
        const save = document.createElement("button");
        save.className = "agent-action";
        save.type = "button";
        save.textContent = "Replace node";
        save.addEventListener("click", async () => {
          try {
            const replacement = JSON.parse(editor.value);
            if (!reason.value.trim()) throw new Error("A replacement reason is required.");
            const runId = activeAgentRun.id;
            const response = await fetch(
              `/api/agent/runs/${encodeURIComponent(runId)}/graph/nodes/${encodeURIComponent(node.key)}/replace`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ replacement, reason: reason.value.trim(), cascade: cascade.checked }),
              },
            );
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.detail || "Could not replace graph node.");
            operatorDialog.close();
            await loadAgentRun(runId);
          } catch (error) {
            window.alert(error.message);
          }
        });
        content.append(field, reasonField, cascadeLabel, save);
        showOperatorDialog(`Edit graph node · ${node.key}`, content);
      }
      async function openArtifact(key, name) {
        if (!activeAgentRun) return;
        try {
          const response = await fetch(
            `/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/graph/nodes/${encodeURIComponent(key)}/artifacts/${encodeURIComponent(name)}`,
          );
          const artifact = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(artifact.detail || "Could not read artifact.");
          const content = document.createElement("div");
          const meta = document.createElement("div");
          meta.className = "operator-card-meta";
          meta.textContent = `${artifact.type} · ${artifact.bytes} B · sha256 ${artifact.content_sha256}`;
          const preview = document.createElement("pre");
          preview.className = "operator-pre";
          preview.textContent = typeof artifact.content === "string"
            ? artifact.content
            : JSON.stringify(artifact.content, null, 2);
          const actions = document.createElement("div");
          actions.className = "operator-row";
          const copy = document.createElement("button");
          copy.className = "agent-action";
          copy.type = "button";
          copy.textContent = "Copy";
          copy.addEventListener("click", () => navigator.clipboard.writeText(preview.textContent));
          const download = document.createElement("button");
          download.className = "agent-action";
          download.type = "button";
          download.textContent = "Download";
          download.addEventListener("click", () => {
            const blob = new Blob([preview.textContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = `${artifact.name}.${artifact.type === "json" ? "json" : "txt"}`;
            anchor.click();
            URL.revokeObjectURL(url);
          });
          actions.append(copy, download);
          content.append(meta, preview, actions);
          showOperatorDialog(`Artifact · ${artifact.name}`, content);
        } catch (error) {
          showError(error.message);
        }
      }
      async function loadGraphTimeline() {
        if (!activeAgentRun || graphView !== "timeline") return;
        agentGraphTimelineEl.textContent = "Loading timeline…";
        try {
          const response = await fetch(`/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/events`);
          if (!response.ok) throw new Error("Could not load graph timeline.");
          const events = await response.json();
          agentGraphTimelineEl.replaceChildren();
          for (const entry of events.filter((item) => item.type.includes("graph") || item.type.includes("worker"))) {
            const row = document.createElement("div");
            row.className = "timeline-item";
            const time = document.createElement("div");
            time.className = "timeline-time";
            time.textContent = new Date(entry.created_at).toLocaleTimeString();
            const event = document.createElement("div");
            event.className = "timeline-event";
            event.textContent = `${entry.seq}. ${entry.type.replaceAll("_", " ")} · ${JSON.stringify(entry.data)}`;
            row.append(time, event);
            agentGraphTimelineEl.append(row);
          }
          if (!agentGraphTimelineEl.children.length) agentGraphTimelineEl.textContent = "No graph events yet.";
        } catch (error) {
          agentGraphTimelineEl.textContent = error.message;
        }
      }
      function resizePrompt() {
        promptEl.style.height = "auto";
        promptEl.style.height = `${Math.min(promptEl.scrollHeight, 180)}px`;
        if (!controller) sendButton.disabled = !promptEl.value.trim();
        steerAgentButton.disabled = !promptEl.value.trim();
      }
      function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
      function addMessage(role, content = "") {
        emptyEl.hidden = true;
        clearButton.hidden = false;
        const article = document.createElement("article");
        article.className = `message ${role}`;

        else text.textContent = content;
        article.append(text);
        messagesEl.append(article);
        scrollToBottom();
        return text;
      }
      function showError(message) {
        const error = document.createElement("div");
        error.className = "error";
        error.textContent = message;
        messagesEl.append(error);
        scrollToBottom();
      }
      function toolDescription(name, path, complete = false) {
        const verbs = {
          list_files: complete ? "Listed" : "Listing",
          search_files: complete ? "Searched" : "Searching",
          read_file: complete ? "Read" : "Reading",

          list_state: complete ? "Listed" : "Listing",
          read_state: complete ? "Read" : "Reading",
          write_state: complete ? "Updated" : "Updating",
          delete_state: complete ? "Deleted" : "Deleting",
          search_memory: complete ? "Searched memory for" : "Searching memory for",

          forget_lesson: complete ? "Forgot lesson" : "Forgetting lesson",

          refresh_repository_index: complete ? "Refreshed" : "Refreshing",

      async function readStream(response, target) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let answer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const events = buffer.split(/\r?\n\r?\n/);
          buffer = events.pop() || "";
          for (const event of events) {
            const data = event.split(/\r?\n/)
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).trim())
              .join("\n");
            if (!data || data === "[DONE]") continue;
            const payload = JSON.parse(data);
            if (payload.harness_event) {
              if (payload.harness_event === "agent_finished") {
                const finalText = payload.summary || payload.message || `Agent ${payload.status}.`;
                answer += `${answer ? "\n\n" : ""}${finalText}`;
                renderMarkdownInto(target, answer);
              }
              handleToolEvent(payload, target);
              continue;
            }
            answer += extractToken(payload);
            renderMarkdownInto(target, answer);
            scrollToBottom();
          }
          if (done) break;
        }

            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,

            throw new Error(payload.detail || `Request failed with HTTP ${response.status}`);

            const nodes = document.createElement("pre");
            nodes.className = "operator-pre";
            nodes.textContent = `Node differences\n${JSON.stringify(comparison.node_differences, null, 2)}`;
            content.append(nodes);
          }
          showOperatorDialog("Run comparison", content);
        } catch (error) { showError(error.message); }
      }
      async function cloneAgentRun() {
        if (!activeAgentRun || controller) return;
        const goal = window.prompt("Goal for the cloned run:", activeAgentRun.goal);
        if (goal === null || !goal.trim()) return;
        try {
          const response = await fetch(`/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/clone`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ goal: goal.trim() }),
          });
          const clone = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(clone.detail || "Could not clone run.");
          renderAgentRun(clone);
        } catch (error) { showError(error.message); }
      }
      async function debugAgentRun() {
        if (!activeAgentRun) return;
        try {
          const response = await fetch(`/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/debug`);
          const debug = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(debug.detail || "Could not load debug snapshot.");
          const content = document.createElement("div");
          const diagnostics = document.createElement("pre");
          diagnostics.className = "operator-pre";
          diagnostics.textContent = JSON.stringify(debug.diagnostics, null, 2);
          const events = document.createElement("pre");
          events.className = "operator-pre";
          events.textContent = JSON.stringify(debug.recent_events, null, 2);
          content.append(diagnostics, events);
          showOperatorDialog("Run debug snapshot", content);
        } catch (error) { showError(error.message); }
      }
      async function stopAgentRun() {
        if (!activeAgentRun) return;
        stopAgentButton.disabled = true;
        try {
          const response = await fetch(
            `/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/stop`,
            { method: "POST" },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || "Could not stop the agent.");
          renderAgentRun(payload);
        } catch (error) {
          showError(error.message);
          stopAgentButton.disabled = false;
        }
      }
      async function resumeAgentRun() {
        if (!activeAgentRun?.resumable || controller) return;
        setMode("agent");
        const target = addMessage("assistant");
        await streamRequest(
          `/api/agent/runs/${encodeURIComponent(activeAgentRun.id)}/resume`,
          {},
          target,
          false,
        );
      }
      async function loadCurrentAgentRun() {
        try {
          const response = await fetch("/api/agent/runs/current");
          if (!response.ok) return;
          const run = await response.json();
          renderAgentRun(run);
          if (run && (run.resumable || ["planning", "working", "waiting_for_approval", "verifying"].includes(run.status))) {
            setMode("agent");
          }
        } catch {
          // Agent state is supplemental; connection status handles server errors.
        }
      }
      async function loadAgentRun(runId) {
        try {
          const response = await fetch(`/api/agent/runs/${encodeURIComponent(runId)}`);
          const run = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(run.detail || "Could not load agent run.");
          renderAgentRun(run);
          setMode("agent");
        } catch (error) {
          showError(error.message);
        }
      }
      async function controlGraphNode(key, action) {
        if (!activeAgentRun?.resumable) return;
        const runId = activeAgentRun.id;
        const reason = window.prompt(`Reason to ${action} ${key}:`);
        if (!reason?.trim()) return;
        try {
          const response = await fetch(
            `/api/agent/runs/${encodeURIComponent(runId)}/graph/nodes/${encodeURIComponent(key)}/control`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action, reason: reason.trim(), cascade: true }),
            },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || `Could not ${action} graph node.`);
          await loadAgentRun(runId);
        } catch (error) {
          showError(error.message);
        }
      }
      async function checkStatus() {
        try {
          const response = await fetch("/api/status");
          const status = await response.json();
          selectedModel = status.selected_model;
          const modeLabels = {
            sandbox: "Sandbox",
            host: "Host shell",
            disabled: "Shell off",
          };
          terminalModeEl.textContent = modeLabels[status.terminal_mode] || status.terminal_mode;
          terminalModeEl.classList.toggle("host", status.terminal_mode === "host");
          terminalModeEl.classList.toggle("unready", status.terminal_mode === "sandbox" && status.sandbox_ready === false);
          terminalModeEl.title = status.sandbox_error || (status.sandbox_ready ? "Sandbox ready" : "");
          grantTerminalEl.disabled = status.terminal_mode === "disabled"
            || (status.terminal_mode === "sandbox" && status.sandbox_ready === false);
          statusEl.className = `status ${status.connected ? "online" : "offline"}`;
          const label = status.connected ? "Connected" : "Disconnected";
          statusText.textContent = label;
          statusEl.title = label;
          await checkMemoryStatus();
        } catch {
          statusEl.className = "status offline";
          statusText.textContent = "Disconnected";
          statusEl.title = "Disconnected";
        }
      }
      async function openMemoryBrowser(initialQuery = "") {
        const content = document.createElement("div");
        content.className = "operator-grid";
        const controls = document.createElement("div");
        controls.className = "operator-row";
        const query = document.createElement("input");
        query.placeholder = "Search artifacts, lessons, runs, context, and repository";
        query.value = initialQuery;
        query.style.flex = "1 1 340px";
        const kind = document.createElement("select");
        for (const [value, label] of [
          ["", "All memory"],
          ["artifact", "Artifacts"],
          ["lesson", "Lessons"],
          ["run", "Runs"],
          ["context", "Context"],
          ["repository", "Repository"],
        ]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          kind.append(option);
        }
        const search = document.createElement("button");
        search.className = "agent-action";
        search.type = "button";
        search.textContent = "Search";
        const refresh = document.createElement("button");
        refresh.className = "agent-action";
        refresh.type = "button";
        refresh.textContent = "Refresh repo";
        refresh.addEventListener("click", refreshMemoryIndex);
        const consolidate = document.createElement("button");
        consolidate.className = "agent-action";
        consolidate.type = "button";
        consolidate.textContent = "Consolidate lessons";
        consolidate.addEventListener("click", async () => {
          try {
            const response = await fetch("/api/memory/lessons/consolidate", { method: "POST" });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.detail || "Could not consolidate lessons.");
            window.alert(`Merged ${result.merged_count} duplicate lesson(s).`);
          } catch (error) { showError(error.message); }
        });
        controls.append(query, kind, search, refresh, consolidate);
        const results = document.createElement("div");
        content.append(controls, results);
        const runSearch = async () => {
          if (!query.value.trim()) return;
          results.textContent = "Searching hybrid memory…";
          try {
            const parameters = new URLSearchParams({ q: query.value.trim(), limit: "10" });
            if (kind.value) parameters.append("kinds", kind.value);
            const response = await fetch(`/api/memory/search?${parameters}`);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.detail || "Could not search memory.");
            results.replaceChildren();
            for (const item of payload.results || []) {
              const card = document.createElement("div");
              card.className = "operator-card";
              const title = document.createElement("div");
              title.className = "operator-card-title";
              title.textContent = `${item.kind} · ${item.title}`;
              const meta = document.createElement("div");
              meta.className = "operator-card-meta";
              const components = item.score_components || {};
              meta.textContent = [
                `score ${item.score}`,
                `lexical ${components.lexical ?? 0}`,
                `semantic ${components.semantic ?? 0}`,
                `confidence ${item.confidence}`,
                item.consolidation_count > 1 ? `${item.consolidation_count} consolidated` : "",
                item.stale ? item.stale_reason : item.trust,
              ].filter(Boolean).join(" · ");
              const snippet = document.createElement("pre");
              snippet.className = "operator-pre";
              snippet.textContent = item.snippet;
              const actions = document.createElement("div");
              actions.className = "operator-row";
              const read = document.createElement("button");
              read.className = "agent-action";
              read.type = "button";
              read.textContent = "Read";
              read.addEventListener("click", () => openMemoryEntry(item.id));
              actions.append(read);
              if (item.kind === "lesson") {
                for (const rating of ["helpful", "unhelpful"]) {
                  const button = document.createElement("button");
                  button.className = "agent-action";
                  button.type = "button";
                  button.textContent = rating === "helpful" ? "Helpful" : "Not helpful";
                  button.addEventListener("click", async () => {
                    const reason = window.prompt(`Optional reason this memory was ${rating}:`) ?? "";
                    try {
                      const response = await fetch(
                        `/api/memory/lessons/${encodeURIComponent(item.id)}/feedback`,
                        {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ rating, reason: reason || null }),
                        },
                      );
                      const feedback = await response.json().catch(() => ({}));
                      if (!response.ok) throw new Error(feedback.detail || "Could not save feedback.");
                      await runSearch();
                    } catch (error) { showError(error.message); }
                  });
                  actions.append(button);
                }
              }
              card.append(title, meta, snippet, actions);
              results.append(card);
            }
            if (!results.children.length) results.textContent = "No matching memory.";
          } catch (error) {
            results.textContent = error.message;
          }
        };
        search.addEventListener("click", runSearch);
        query.addEventListener("keydown", (event) => {
          if (event.key === "Enter") runSearch();
        });
        showOperatorDialog("Hybrid memory browser", content);
        if (initialQuery) runSearch();
      }
      async function openMemoryEntry(memoryId) {
        try {
          const response = await fetch(`/api/memory/entries/${encodeURIComponent(memoryId)}?allow_stale=true`);
          const entry = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(entry.detail || "Could not read memory.");
          const content = document.createElement("div");
          const meta = document.createElement("div");
          meta.className = "operator-card-meta";
          meta.textContent = [
            entry.kind,
            entry.trust,
            `confidence ${entry.confidence}`,
            `sha256 ${entry.content_sha256 || entry.provenance?.sha256 || "n/a"}`,
            entry.stale ? entry.stale_reason : "current",
          ].join(" · ");
          const preview = document.createElement("pre");
          preview.className = "operator-pre";
          preview.textContent = entry.content;
          const provenance = document.createElement("pre");
          provenance.className = "operator-pre";
          provenance.textContent = JSON.stringify(entry.provenance, null, 2);
          content.append(meta, preview, provenance);
          showOperatorDialog(`Memory · ${entry.title}`, content);
        } catch (error) { showError(error.message); }
      }
      async function checkMemoryStatus() {
        try {
          const response = await fetch("/api/memory/status");
          const memory = await response.json();
          if (!response.ok) throw new Error(memory.detail || "Memory unavailable");
          const repository = memory.repository || {};
          const kinds = memory.entry_kinds || {};
          const feedback = memory.lesson_feedback || {};
          memoryStatusEl.textContent = `Memory ${memory.active_entries || 0}`;
          memoryStatusEl.title = [
            `${memory.active_entries || 0} active records`,
            `${kinds.artifact || 0} artifact memories`,
            `${kinds.lesson || 0} lessons`,
            `${feedback.helpful || 0} helpful / ${feedback.unhelpful || 0} unhelpful ratings`,
            `${memory.retrieval?.mode || "hybrid"} retrieval`,
            `${repository.files || 0} indexed files`,
            `${repository.chunks || 0} indexed chunks`,
            repository.updated_at ? `Indexed ${repository.updated_at}` : "Index not built",
            repository.truncated ? "Index reached a configured bound" : "Index complete",
          ].join("\n");
        } catch (error) {
          memoryStatusEl.textContent = "Memory !";
          memoryStatusEl.title = error.message;
        }
      }
      async function refreshMemoryIndex() {
        memoryStatusEl.disabled = true;
        memoryStatusEl.textContent = "Memory …";
        try {
          const response = await fetch("/api/memory/index/refresh", { method: "POST" });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || "Could not refresh memory index.");
          await checkMemoryStatus();
        } catch (error) {
          showError(error.message);
        } finally {
          memoryStatusEl.disabled = false;
        }
      }
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (controller) {
          if (interactionMode === "agent") stopAgentRun();
          else controller.abort();
          return;
        }
        const text = promptEl.value.trim();
        if (!text) return;
        promptEl.value = "";
        resizePrompt();
        sendMessage(text);
      });
      promptEl.addEventListener("input", resizePrompt);
      promptEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
      sendButton.addEventListener("click", (event) => {
        if (!controller) return;
        event.preventDefault();
        if (interactionMode === "agent") stopAgentRun();
        else controller.abort();
      });
      clearButton.addEventListener("click", () => {
        if (controller) {
          if (interactionMode === "agent") stopAgentRun();
          else controller.abort();
          return;
        }
        messages = [];
        messagesEl.replaceChildren(emptyEl);
        emptyEl.hidden = false;
        clearButton.hidden = true;
        toolCards.clear();
        promptEl.focus();
      });
      chatModeButton.addEventListener("click", () => setMode("chat"));
      agentModeButton.addEventListener("click", () => setMode("agent"));
      stopAgentButton.addEventListener("click", stopAgentRun);
      resumeAgentButton.addEventListener("click", resumeAgentRun);
      steerAgentButton.addEventListener("click", steerAgentRun);
      historyAgentButton.addEventListener("click", loadAgentHistory);
      activityAgentButton.addEventListener("click", loadAgentActivity);
      observeAgentButton.addEventListener("click", loadRunObservability);
      evalsAgentButton.addEventListener("click", loadRegressionScenarios);
      templatesAgentButton.addEventListener("click", loadGraphTemplates);
      compareAgentButton.addEventListener("click", () => openRunComparison());
      cloneAgentButton.addEventListener("click", cloneAgentRun);
      debugAgentButton.addEventListener("click", debugAgentRun);
      graphDagViewButton.addEventListener("click", () => {
        graphView = "dag";
        if (activeAgentRun) renderGraph(activeAgentRun);
      });
      graphTimelineViewButton.addEventListener("click", () => {
        graphView = "timeline";
        if (activeAgentRun) renderGraph(activeAgentRun);
      });
      operatorDialogCloseButton.addEventListener("click", () => operatorDialog.close());
      operatorDialog.addEventListener("click", (event) => {
        if (event.target === operatorDialog) operatorDialog.close();
      });
      memoryStatusEl.addEventListener("click", () => openMemoryBrowser());
      newAgentButton.addEventListener("click", () => {
        grantWorkspaceEl.checked = false;
        grantTerminalEl.checked = false;
        renderAgentRun(null);
        setMode("agent");
      });
      checkStatus();
      loadCurrentAgentRun();
      setInterval(checkStatus, 10000);
      resizePrompt();
    </script>
  </body>
</html>
